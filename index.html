<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; worker-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com">
    <meta name="referrer" content="no-referrer">
    <title>LOSMENKU</title>
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004ac6">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p: #2563eb;
            --p2: #7c3aed;
            --bg: #f3f5fb;
            --sf: #fff;
            --tx: #0f172a;
            --mut: #64748b;
            --ln: #e5e9f2;
            --err: #dc2626;
            --ok: #16a34a;
            --warn: #d97706;
            --sh: 0 1px 2px #0f172a0d, 0 6px 20px #0f172a0b;
            --hd: #ffffffd9
        }

        [data-theme=dark] {
            --bg: #0b1120;
            --sf: #131c31;
            --tx: #e8ecf7;
            --mut: #93a0b8;
            --ln: #24304a;
            --sh: 0 1px 2px #0006;
            --hd: #0b1120d9
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 15px/1.5 'Plus Jakarta Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--tx);
            -webkit-tap-highlight-color: transparent
        }

        button,
        input,
        select {
            font: inherit;
            color: inherit
        }

        .hide {
            display: none !important
        }

        svg.lucide {
            width: 18px;
            height: 18px;
            vertical-align: -4px;
            flex: none
        }

        h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: -.02em
        }

        h3 {
            margin: 0 0 10px;
            font-size: 16px
        }

        .btn {
            border: 0;
            border-radius: 12px;
            padding: 10px 16px;
            background: linear-gradient(135deg, var(--p), #4f46e5);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            transition: .15s
        }

        .btn:hover {
            filter: brightness(1.08)
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn:disabled {
            opacity: .5;
            pointer-events: none
        }

        .btn.s {
            padding: 7px 9px;
            border-radius: 10px
        }

        .btn.s svg {
            width: 16px;
            height: 16px
        }

        .btn.g {
            background: var(--ln);
            color: var(--tx)
        }

        .btn.d {
            background: var(--err)
        }

        .btn.k {
            background: var(--ok)
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--ln);
            border-radius: 12px;
            background: var(--sf)
        }

        input:focus,
        select:focus {
            outline: 2px solid var(--p);
            border-color: transparent
        }

        input[readonly] {
            opacity: .6
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--mut);
            margin: 12px 0 4px
        }

        #login {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: radial-gradient(at 20% 10%, #4f46e5, transparent 50%), linear-gradient(135deg, #1d4ed8, #2563eb 55%, #0891b2)
        }

        .box {
            background: var(--sf);
            border-radius: 22px;
            padding: 26px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 24px 60px #0004;
            animation: up .3s
        }

        .logo {
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -.02em;
            display: flex;
            gap: 8px;
            align-items: center;
            background: linear-gradient(135deg, var(--p), var(--p2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .logo svg {
            color: var(--p)
        }

        .err {
            color: var(--err);
            font-size: 13px;
            min-height: 20px;
            margin-top: 8px
        }

        header {
            position: sticky;
            top: 0;
            z-index: 9;
            background: var(--hd);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--ln);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        header .sp {
            flex: 1
        }

        header span {
            color: var(--mut);
            font-size: 13px;
            font-weight: 600
        }

        #app {
            display: flex;
            min-height: calc(100vh - 57px)
        }

        nav {
            width: 216px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: sticky;
            top: 57px;
            height: calc(100vh - 57px);
            border-right: 1px solid var(--ln)
        }

        nav a {
            padding: 10px 12px;
            border-radius: 12px;
            color: var(--mut);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: center;
            transition: .15s
        }

        nav a:hover {
            background: var(--ln)
        }

        nav a.on {
            background: linear-gradient(135deg, var(--p), #4f46e5);
            color: #fff;
            box-shadow: 0 6px 16px #2563eb44
        }

        main {
            flex: 1;
            padding: 22px;
            max-width: 1120px;
            margin: 0 auto;
            width: 100%;
            min-width: 0;
            animation: in .25s
        }

        @keyframes in {
            from {
                opacity: .4
            }
        }

        @keyframes up {
            from {
                transform: translateY(14px);
                opacity: 0
            }
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

        .top>div {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .top input,
        .top select {
            width: auto;
            min-width: 130px
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 20px;
            border-radius: 20px;
            color: #fff;
            background: linear-gradient(135deg, #2563eb, #7c3aed)
        }

        .hero p {
            margin: 2px 0 0;
            opacity: .85;
            font-size: 13px
        }

        .hero .btn {
            background: #fff3
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px
        }

        .card {
            background: var(--sf);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--sh)
        }

        .stat {
            display: flex;
            gap: 12px;
            align-items: center
        }

        .ib {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: color-mix(in srgb, var(--c) 15%, transparent);
            color: var(--c)
        }

        .ib svg {
            width: 22px;
            height: 22px
        }

        .stat small {
            color: var(--mut);
            font-weight: 600;
            font-size: 12px
        }

        .stat b {
            display: block;
            font-size: 21px;
            line-height: 1.2
        }

        .cols {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 12px;
            margin-bottom: 16px
        }

        .dn {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center
        }

        .lg {
            list-style: none;
            margin: 0;
            padding: 0;
            font-size: 13px
        }

        .lg li {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 3px 0
        }

        .lg i {
            width: 10px;
            height: 10px;
            border-radius: 50%
        }

        .lg b {
            margin-left: auto;
            padding-left: 14px
        }

        svg rect {
            transform-box: fill-box;
            transform-origin: bottom;
            animation: gr .6s ease-out
        }

        @keyframes gr {
            from {
                transform: scaleY(0)
            }
        }

        .tw {
            overflow-x: auto;
            background: var(--sf);
            border-radius: 18px;
            box-shadow: var(--sh)
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--ln);
            font-size: 14px
        }

        tr:last-child td {
            border: 0
        }

        th {
            color: var(--mut);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .04em
        }

        td.a {
            white-space: nowrap
        }

        .tag {
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            background: var(--ln)
        }

        .Tersedia,
        .Selesai,
        .Aktif {
            background: #16a34a22;
            color: var(--ok)
        }

        .Terisi,
        .Check-in {
            background: #2563eb22;
            color: var(--p)
        }

        .Dibersihkan,
        .Booking {
            background: #d9770622;
            color: var(--warn)
        }

        .Perbaikan,
        .Batal,
        .Nonaktif {
            background: #dc262622;
            color: var(--err)
        }

        .rooms {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px
        }

        .room {
            border-top: 4px solid var(--ln)
        }

        .room.Tersedia {
            border-color: var(--ok)
        }

        .room.Terisi {
            border-color: var(--p)
        }

        .room.Dibersihkan {
            border-color: #f59e0b
        }

        .room.Perbaikan {
            border-color: var(--err)
        }

        .room h3 {
            margin: 0
        }

        .room p {
            margin: 2px 0 10px;
            color: var(--mut);
            font-size: 13px
        }

        .empty {
            text-align: center;
            color: var(--mut);
            padding: 30px;
            grid-column: 1/-1
        }

        .skel {
            height: 90px;
            border-radius: 18px;
            background: linear-gradient(90deg, var(--ln), var(--sf), var(--ln));
            background-size: 200% 100%;
            animation: sh 1.1s infinite
        }

        @keyframes sh {
            to {
                background-position: -200% 0
            }
        }

        .mask {
            position: fixed;
            inset: 0;
            background: #0f172a80;
            backdrop-filter: blur(3px);
            display: grid;
            place-items: center;
            padding: 14px;
            z-index: 20
        }

        .mask .box {
            max-height: 92vh;
            overflow: auto
        }

        .rc {
            font: 12px/1.4 ui-monospace, Menlo, monospace;
            background: #fafafa;
            color: #111;
            border: 1px dashed #bbb;
            padding: 12px;
            white-space: pre-wrap;
            width: 240px;
            margin: 8px auto
        }

        #toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #fff;
            padding: 12px 18px;
            border-radius: 14px;
            z-index: 30;
            max-width: 90vw;
            box-shadow: 0 10px 30px #0005;
            animation: up .2s
        }

        #rcp {
            display: none
        }

        @page {
            size: 58mm auto;
            margin: 2mm
        }

        @media print {
            body>*:not(#rcp) {
                display: none !important
            }

            #rcp {
                display: block;
                font: 11px/1.3 monospace;
                width: 54mm;
                white-space: pre-wrap;
                color: #000
            }
        }

        @media(max-width:860px) {
            .cols {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:760px) {
            #app {
                display: block;
                padding-bottom: 84px
            }

            nav {
                position: fixed;
                bottom: 10px;
                left: 10px;
                right: 10px;
                top: auto;
                width: auto;
                height: auto;
                flex-direction: row;
                gap: 2px;
                padding: 6px;
                z-index: 10;
                border: 1px solid var(--ln);
                border-radius: 20px;
                background: var(--hd);
                backdrop-filter: blur(14px);
                box-shadow: 0 10px 30px #0003
            }

            nav a {
                flex: 1;
                flex-direction: column;
                gap: 0;
                padding: 6px 2px;
                font-size: 10px;
                justify-content: center;
                align-items: center;
                min-width: 0
            }

            nav a svg {
                width: 20px;
                height: 20px
            }

            main {
                padding: 14px
            }

            header span {
                display: none
            }

            .grid {
                grid-template-columns: 1fr 1fr
            }

            .stat {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px
            }

            .tw {
                background: none;
                box-shadow: none;
                overflow: visible
            }

            table,
            tbody {
                display: block
            }

            thead {
                display: none
            }

            tr {
                display: block;
                background: var(--sf);
                margin-bottom: 10px;
                border-radius: 16px;
                box-shadow: var(--sh);
                padding: 6px 0
            }

            td {
                display: flex;
                justify-content: space-between;
                gap: 12px;
                border: 0;
                padding: 5px 14px;
                text-align: right
            }

            td::before {
                content: attr(data-l);
                color: var(--mut);
                font-weight: 600;
                font-size: 12px;
                text-align: left;
                flex: none
            }

            td.a {
                justify-content: flex-end;
                flex-wrap: wrap
            }

            td.a::before {
                display: none
            }

            .mask {
                align-items: end;
                padding: 0
            }

            .mask .box {
                max-width: none;
                border-radius: 24px 24px 0 0;
                animation: up .25s
            }

            .top>div {
                width: 100%
            }

            .top input,
            .top select {
                flex: 1
            }
        }
    </style>
</head>

<body>
    <section id="login">
        <form class="box" id="lf" autocomplete="on">
            <div class="logo"><i data-lucide="building-2"></i>LOSMENKU</div>
            <p style="color:var(--mut);margin:4px 0 8px">Masuk untuk mengelola properti Anda</p>
            <label for="u">Username</label><input id="u" autocomplete="username" required maxlength="40">
            <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required maxlength="100">
            <div class="err" id="le" role="alert"></div><button class="btn" style="width:100%" id="lb"><i data-lucide="log-in"></i>Masuk</button>
        </form>
    </section>
    <div id="shell" class="hide">
        <header>
            <div class="logo"><i data-lucide="building-2"></i><b id="pn">LOSMENKU</b></div>
            <div class="sp"></div><button class="btn g s hide" id="sy"></button><span id="who"></span><button class="btn g s" id="th" title="Tema"><i data-lucide="moon"></i></button><button class="btn g s" id="pw" title="Ganti password"><i data-lucide="key-round"></i></button><button class="btn g s" id="out" title="Keluar"><i data-lucide="log-out"></i></button>
        </header>
        <div id="app">
            <nav>
                <a data-v="dash" class="on"><i data-lucide="layout-dashboard"></i>Beranda</a><a data-v="kamar"><i data-lucide="bed-double"></i>Kamar</a><a data-v="res"><i data-lucide="calendar-check"></i>Reservasi</a><a data-v="lap"><i data-lucide="trending-up"></i>Laporan</a><a data-v="user" class="adm"><i data-lucide="users"></i>Pengguna</a><a data-v="set" class="adm"><i data-lucide="settings"></i>Pengaturan</a>
            </nav>
            <main id="m"></main>
        </div>
    </div>
    <div id="toast" class="hide" role="status"></div>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyVzmnhLcOUVAsW8dGzUc4GEsGiI_lyWrg8dlhrloq-a-dwxSBjK4eXBajGrdemtuVF/exec';
        const $ = s => document.querySelector(s),
            rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID'),
            ic = (n, t) => `<i data-lucide="${n}"${t?` title="${t}"`:''}></i>`;
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        } [c]));
        const hp = s => String(s || '').replace(/^'/, ''),
            today = () => new Date().toLocaleDateString('sv-SE');
        let S = null,
            view = 'dash',
            CFG = {
                nama: 'LOSMENKU'
            },
            RES = [];
        const LS = (k, d) => {
                try {
                    return JSON.parse(localStorage.getItem(k)) || d
                } catch (e) {
                    return d
                }
            },
            SV = (k, v) => {
                try {
                    localStorage.setItem(k, JSON.stringify(v))
                } catch (e) {}
            };
        S = LS('sess', null);
        let Q = LS('queue', []),
            C = LS('cache', {});
        const saveQ = () => SV('queue', Q),
            saveC = () => SV('cache', C);
        let raf;
        new MutationObserver(() => {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(() => window.lucide && lucide.createIcons())
        }).observe(document.body, {
            childList: true,
            subtree: true
        });

        function toast(t) {
            const e = $('#toast');
            e.textContent = t;
            e.classList.remove('hide');
            clearTimeout(toast.t);
            toast.t = setTimeout(() => e.classList.add('hide'), 3500)
        }
        const E = (m, net) => {
            const e = new Error(m);
            e.net = net;
            return e
        };
        async function net(action, data) {
            if (!API_URL.startsWith('https://')) throw E('API_URL belum diatur di index.html', false);
            const ctl = new AbortController(),
                t = setTimeout(() => ctl.abort(), 25000);
            try {
                const r = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({
                        action,
                        data,
                        token: S && S.token
                    }),
                    signal: ctl.signal
                });
                const j = await r.json();
                if (!j.ok) {
                    if (j.error === 'SESSION') {
                        logout(true, 'Sesi berakhir, silakan login kembali', true);
                        const e = E('Sesi berakhir, silakan login kembali', false);
                        e.session = true;
                        throw e
                    }
                    throw E(j.error, false)
                }
                return j.data;
            } catch (e) {
                if (e.net === false) throw e;
                throw E(e.name === 'AbortError' ? 'Koneksi timeout, coba lagi' : 'Tidak dapat terhubung ke server', true)
            } finally {
                clearTimeout(t)
            }
        }
        /* ---- offline: cache baca, antrean tulis, sinkron otomatis ---- */
        const WQ = new Set(['roomStatus', 'roomSave', 'roomDelete', 'resSave', 'resEdit', 'pay', 'resAction']),
            RC = ['roomList', 'resList', 'settingsGet'];
        const online = () => navigator.onLine;

        function netUI() {
            const b = $('#sy');
            if (!b) return;
            const off = !online(),
                n = Q.length;
            b.classList.toggle('hide', !off && !n);
            b.innerHTML = (off ? ic('wifi-off') + 'Offline' : ic('refresh-cw') + 'Sinkron') + (n ? ' · ' + n : '');
            b.title = n ? n + ' data menunggu sinkronisasi' : 'Mode offline'
        }

        function dashLocal() {
            const k = C.roomList || [],
                r = C.resList || [],
                t = today(),
                cnt = s => k.filter(x => x.status === s).length,
                sum = (l, f) => l.reduce((a, x) => a + f(x), 0);
            return {
                total: k.length,
                tersedia: cnt('Tersedia'),
                terisi: cnt('Terisi'),
                dibersihkan: cnt('Dibersihkan'),
                perbaikan: cnt('Perbaikan'),
                checkinHariIni: r.filter(x => x.checkin === t && x.status === 'Booking').length,
                checkoutHariIni: r.filter(x => x.checkout === t && x.status === 'Check-in').length,
                okupansi: k.length ? Math.round(cnt('Terisi') / k.length * 100) : 0,
                pendapatan: sum(r.filter(x => x.status !== 'Batal'), x => +x.dibayar || 0),
                piutang: sum(r.filter(x => ['Booking', 'Check-in', 'Selesai'].includes(x.status)), x => Math.max(0, x.total - (+x.dibayar || 0)))
            }
        }

        function local(a, d) { // terapkan perubahan ke cache lokal + validasi dasar
            const rooms = C.roomList = C.roomList || [],
                res = C.resList = C.resList || [],
                room = id => rooms.find(x => x.id === id),
                R = id => res.find(x => x.id === id),
                bad = m => {
                    throw E(m, false)
                };
            if (a === 'roomStatus')(room(d.id) || bad('Kamar tidak ditemukan')).status = d.status;
            if (a === 'roomSave') {
                const id = String(d.id).trim().toUpperCase(),
                    k = room(id),
                    o = {
                        id,
                        nama: d.nama,
                        tipe: d.tipe,
                        harga: +d.harga,
                        status: k ? k.status : 'Tersedia'
                    };
                k ? Object.assign(k, o) : rooms.push(o)
            }
            if (a === 'roomDelete') {

                    ST.kf = $('#fs').value;
                    const l = k.filter(r => (!ST.kf || r.status === ST.kf) && (r.nama + r.tipe + r.id).toLowerCase().includes(ST.kq.toLowerCase()));
                    $('#kl').innerHTML = l.map(r => `<div class="card room ${esc(r.status)}"><h3>${esc(r.nama)}</h3><p>${esc(r.tipe)} · ${rp(r.harga)}/malam</p><select data-id="${esc(r.id)}" aria-label="Status ${esc(r.nama)}">${st.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select>${adm?`<div style="margin-top:8px;display:flex;gap:6px">${btn('pencil','Ubah',`data-e="${esc(r.id)}"`,'g')}${btn('trash-2','Hapus',`data-x="${esc(r.id)}"`,'d')}</div>`:''}</div>`).join('') || '<div class="empty">Tidak ada kamar</div>'
                };
                $('#q').oninput = draw;
                $('#fs').onchange = draw;
                draw();
                $('#kl').onchange = e => {
                    const s = e.target.closest('select');
                    if (s) run(async () => {
                        await api('roomStatus', {
                            id: s.dataset.id,
                            status: s.value
                        });
                        V.kamar()
                    }, 'Status diperbarui')
                };
                $('#kl').onclick = e => {
                    const b = e.target.closest('[data-e],[data-x]');
                    if (!b) return;
                    if (b.dataset.e) return edit(k.find(x => x.id === b.dataset.e));
                    if (confirm('Hapus kamar ' + b.dataset.x + '?')) run(async () => {
                        await api('roomDelete', {
                            id: b.dataset.x
                        });
                        V.kamar()
                    }, 'Kamar dihapus')
                };
                if (adm) $('#add').onclick = () => edit()
            },
            async res() {
                const p = P(),
                    [r, k] = await Promise.all([api('resList'), api('roomList')]);
                if (!p.ok()) return;
                RES = r;
                p(`<div class="top"><h2>Reservasi</h2><div><input id="q" type="search" placeholder="Cari tamu / kamar…" value="${esc(ST.q)}"><select id="fs"><option value="">Semua status</option>${['Booking','Check-in','Selesai','Batal'].map(s=>`<option ${s===ST.fs?'selected':''}>${s}</option>`).join('')}</select><button class="btn" id="add">${ic('plus')}Reservasi</button></div></div><div id="rl"></div>`);
                const draw = () => {
                    ST.q = $('#q').value;
                    ST.fs = $('#fs').value;
                    const q = ST.q.toLowerCase(),
                        l = RES.filter(x => (!ST.fs || x.status === ST.fs) && (x.tamu + x.kamar + x.id).toLowerCase().includes(q));
                    $('#rl').innerHTML = tbl(['Tamu', 'Kamar', 'Tanggal', 'Total', 'Status', 'Aksi'], l.map(x => {
                        const sisa = x.total - x.dibayar,
                            B = x.status === 'Booking',
                            C2 = x.status === 'Check-in',
                            id = `data-id="${esc(x.id)}"`;
                        return `<tr><td><b>${esc(x.tamu)}</b><br><small>${esc(hp(x.hp))}</small></td><td>${esc(x.kamar)}</td><td>${esc(x.checkin)} → ${esc(x.checkout)}</td><td>${rp(x.total)}<br><small>${sisa<=0?'Lunas':'Dibayar '+rp(x.dibayar)}</small></td><td>${tag(x.status)}</td><td class="a">${(B||C2)&&sisa>0?btn('wallet','Catat pembayaran',`data-a="pay" ${id}`,'k'):''} ${B?btn('log-in','Check-in',`data-a="checkin" ${id}`):''}${C2?btn('log-out','Check-out',`data-a="checkout" ${id}`):''} ${B||C2?btn('pencil','Ubah',`data-a="edit" ${id}`,'g'):''} ${x.status!=='Batal'?btn('receipt','Kwitansi',`data-a="rc" ${id}`,'g'):''} ${B?btn('ban','Batalkan',`data-a="batal" ${id}`,'d'):''}</td></tr>`
                    }).join(''))
                };
                $('#rl').onclick = e => {
                    const b = e.target.closest('[data-a]');
                    if (!b) return;
                    const x = RES.find(y => y.id === b.dataset.id),
                        a = b.dataset.a;
                    if (!x) return toast('Data tidak ditemukan, muat ulang halaman');
                    if (a === 'rc') return kwitansi(x);
                    if (a === 'edit') return modal('Ubah Reservasi', resForm(k, x), async o => {
                        await api('resEdit', {
                            id: x.id,
                            ...o
                        });
                        V.res()
                    });
                    if (a === 'pay') return modal('Catat Pembayaran', `<p>${esc(x.tamu)} · sisa <b>${rp(x.total-x.dibayar)}</b></p>` + inp('jumlah', 'Jumlah (Rp)', 'number', x.total - x.dibayar, `min="1" max="${x.total-x.dibayar}"`) + sel('metode', 'Metode', ['Tunai', 'Transfer', 'QRIS'].map(m => [m, m])), async o => {
                        await api('pay', {
                            id: x.id,
                            ...o
                        });
                        V.res()
                    });
                    if (a === 'batal' && !confirm('Batalkan reservasi ini?')) return;
                    run(async () => {
                        await api('resAction', {
                            id: x.id,
                            type: a
                        });
                        V.res()
                    }, 'Berhasil')
                };
                $('#q').oninput = draw;
                $('#fs').onchange = draw;
                draw();
                $('#add').onclick = () => k.length ? modal('Reservasi Baru', resForm(k), async o => {
                    await api('resSave', o);
                    V.res()
                }) : toast('Tambahkan kamar terlebih dahulu')
            },
            async lap() {
                const p = P(),
                    r = await api('resList');
                if (!p.ok()) return;
                const mo = ST.mo || today().slice(0, 7);
                let l = [];
                p(`<div class="top"><h2>Laporan</h2><div><input type="month" id="mo" value="${mo}"><button class="btn g" id="csv">${ic('download')}CSV</button></div></div><div id="lr"></div>`);
                const draw = () => {
                    ST.mo = $('#mo').value || mo;
                    l = r.filter(x => x.checkin.startsWith(ST.mo) && x.status !== 'Batal');
                    const T = l.reduce((a, x) => a + Number(x.total), 0),
                        Pd = l.reduce((a, x) => a + Number(x.dibayar), 0),
                        n = new Date(ST.mo.slice(0, 4), ST.mo.slice(5), 0).getDate(),
                        days = [...Array(n)].map((_, i) => ({
                            l: String(i + 1),
                            v: l.filter(x => +x.checkin.slice(8) === i + 1).reduce((a, x) => a + Number(x.dibayar), 0)
                        }));
                    $('#lr').innerHTML = `<div class="grid">${card('calendar-check','Reservasi',l.length)+card('receipt','Total Tagihan',rp(T),'#7c3aed')+card('wallet','Diterima',rp(Pd),'#16a34a')+card('clock','Piutang',rp(T-Pd),'#d97706')}</div><div class="card" style="margin-bottom:16px"><h3>Pendapatan Harian</h3>${barChart(days)}</div>` + tbl(['ID', 'Tamu', 'Kamar', 'Check-in', 'Total', 'Dibayar', 'Status'], l.map(x => `<tr><td>${esc(x.id)}</td><td>${esc(x.tamu)}</td><td>${esc(x.kamar)}</td><td>${esc(x.checkin)}</td><td>${rp(x.total)}</td><td>${rp(x.dibayar)}</td><td>${tag(x.status)}</td></tr>`).join(''))
                };
                $('#mo').onchange = draw;
                draw();
                $('#csv').onclick = () => {
                    const q = v => '"' + String(/^[=+\-@]/.test(v) ? "'" + v : v).replace(/"/g, '""') + '"',
                        rows = [
                            ['ID', 'Tamu', 'HP', 'Kamar', 'Check-in', 'Check-out', 'Total', 'Dibayar', 'Metode', 'Status'], ...l.map(x => [x.id, x.tamu, hp(x.hp), x.kamar, x.checkin, x.checkout, x.total, x.dibayar, x.metode, x.status])
                        ];
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(z => z.map(q).join(',')).join('\n')], {
                        type: 'text/csv'
                    }));
                    a.download = 'laporan-' + ST.mo + '.csv';
                    a.click();
                    setTimeout(() => URL.revokeObjectURL(a.href), 999)
                }
            },
            async user() {
                const p = P(),
                    u = await api('userList');
                if (!p.ok()) return;
                p(`<div class="top"><h2>Pengguna</h2><button class="btn" id="add">${ic('plus')}Pengguna</button></div>` +
                    tbl(['Username', 'Nama', 'Peran', 'Status', 'Aksi'], u.map(x => `<tr><td>${esc(x.username)}</td><td>${esc(x.nama)}</td><td>${esc(x.role)}</td><td>${tag(x.aktif?'Aktif':'Nonaktif')}</td><td class="a">${btn('pencil','Ubah',`data-ue="${esc(x.username)}"`,'g')} ${btn('key-round','Reset password',`data-reset="${esc(x.username)}"`,'g')}</td></tr>`).join('')));
                $('#add').onclick = () => modal('Pengguna Baru', inp('username', 'Username (huruf kecil, angka, _ .)', 'text', '', 'pattern="[a-z0-9_.]{3,30}" maxlength="30"') + inp('nama', 'Nama lengkap', 'text', '', 'maxlength="60"') + sel('role', 'Peran', ROLES) + PWF, async o => {
                    await api('userSave', o);
                    V.user()
                });
                document.querySelectorAll('[data-ue]').forEach(b => {
                    const x = u.find(y => y.username === b.dataset.ue);
                    if (!x) return;
                    b.onclick = () => modal('Ubah ' + x.username, inp('nama', 'Nama', 'text', x.nama, 'maxlength="60"') + sel('role', 'Peran', ROLES, x.role) + sel('aktif', 'Status', [
                        ['true', 'Aktif'],
                        ['false', 'Nonaktif']
                    ], String(x.aktif)), async o => {
                        await api('userSave', {
                            username: x.username,
                            nama: o.nama,
                            role: o.role,
                            aktif: o.aktif === 'true'
                        });
                        V.user()
                    })
                });
                document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => modal('Reset password ' + b.dataset.reset, inp('password', 'Password baru (min. 8, huruf & angka)', 'password', '', 'minlength="8" autocomplete="new-password"'), async o => {
                    await api('userReset', {
                        username: b.dataset.reset,
                        password: o.password
                    });
                    toast('Password direset')
                }))
            },
            async set() {
                const p = P(),
                    [c, l] = await Promise.all([api('settingsGet'), api('logList')]);
                if (!p.ok()) return;
                p(`<div class="top"><h2>Pengaturan</h2></div><form class="card" id="sf" style="max-width:480px;margin-bottom:18px"><h3>Identitas Properti (tampil di kwitansi)</h3>${inp('nama','Nama','text',c.nama,'maxlength="60"')+inp('alamat','Alamat','text',c.alamat,'maxlength="120"')+inp('telp','Telepon','text',c.telp,'maxlength="30"')+inp('footer','Catatan kaki','text',c.footer,'maxlength="120"')}<button class="btn" style="margin-top:14px">${ic('save')}Simpan</button></form>
  <h3>Log Aktivitas</h3>` + tbl(['Waktu', 'Pengguna', 'Aksi', 'Detail'], l.map(x => `<tr><td>${esc(String(x.waktu).slice(0,16))}</td><td>${esc(x.user)}</td><td>${esc(x.aksi)}</td><td>${esc(x.detail)}</td></tr>`).join('')));
                $('#sf').onsubmit = e => {
                    e.preventDefault();
                    run(async () => {
                        await api('settingsSave', Object.fromEntries(new FormData(e.target)));
                        CFG = await api('settingsGet');
                        $('#pn').textContent = CFG.nama
                    }, 'Pengaturan disimpan')
                }
            }
        };
        $('#pw').onclick = () => modal('Ganti Password', inp('lama', 'Password lama', 'password', '', 'autocomplete="current-password"') + inp('baru', 'Password baru (min. 8, huruf & angka)', 'password', '', 'minlength="8" autocomplete="new-password"'), async o => {
            await api('changePassword', o);
            toast('Password diganti')
        });
        const setTh = t => {
            document.documentElement.dataset.theme = t;
            $('#th').innerHTML = ic(t === 'dark' ? 'sun' : 'moon');
            try {
                localStorage.setItem('th', t)
            } catch (e) {}
        };
        $('#th').onclick = () => setTh(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
        try {
            setTh(localStorage.getItem('th') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'))
        } catch (e) {}
        const IDLE = 15 * 60 * 1000;
        let lastAct = Date.now();
        const touch = () => {
            const n = Date.now();
            if (n - lastAct > 5000) {
                lastAct = n;
                try {
                    localStorage.setItem('act', n)
                } catch (e) {}
            }
        };
        ['click', 'keydown', 'touchstart', 'scroll', 'mousemove'].forEach(ev => addEventListener(ev, touch, {
            passive: true
        }));

        function idleCheck() {
            if (!S || !online()) return;
            const a = +localStorage.getItem('act') || lastAct;
            if (Date.now() - a > IDLE) logout(true, 'Anda keluar otomatis karena tidak aktif selama 15 menit')
        } // saat offline tidak dikunci agar tetap bisa bekerja
        setInterval(idleCheck, 30000);
        idleCheck();
        addEventListener('storage', e => {
            if (e.key === 'sess' && !e.newValue && S) {
                S = null;
                location.reload()
            }
        }); // logout di tab lain
        addEventListener('error', e => {
            if (e.message) toast('Terjadi kesalahan: ' + e.message)
        });
        addEventListener('unhandledrejection', e => {
            e.preventDefault();
            toast((e.reason && e.reason.message) || 'Terjadi kesalahan tak terduga')
        });
        show();
    </script>
</body>

</html>
