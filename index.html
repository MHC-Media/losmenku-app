</style></head><body>
<section id="login"><form class="box" id="lf" autocomplete="on"><div class="logo"><i data-lucide="building-2"></i>LOSMENKU</div><p style="color:var(--mut);margin:4px 0 8px">Masuk untuk mengelola properti Anda</p>
<label for="u">Username</label><input id="u" autocomplete="username" required maxlength="40">
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required maxlength="100">
<div class="err" id="le" role="alert"></div><button class="btn" style="width:100%" id="lb"><i data-lucide="log-in"></i>Masuk</button></form></section>
<div id="shell" class="hide"><header><div class="logo"><i data-lucide="building-2"></i><b id="pn">LOSMENKU</b></div><div class="sp"></div><button class="btn g s hide" id="sy"></button><span id="who"></span><button class="btn g s" id="pw" title="Ganti password"><i data-lucide="key-round"></i></button><button class="btn g s" id="out" title="Keluar"><i data-lucide="log-out"></i></button></header>
<div id="app"><nav>
<a data-v="dash" class="on"><i data-lucide="layout-dashboard"></i>Beranda</a><a data-v="kamar"><i data-lucide="bed-double"></i>Kamar</a><a data-v="res"><i data-lucide="calendar-check"></i>Reservasi</a><a data-v="lap"><i data-lucide="trending-up"></i>Laporan</a><a data-v="user" class="adm"><i data-lucide="users"></i>Pengguna</a><a data-v="set" class="adm"><i data-lucide="settings"></i>Pengaturan</a></nav>
<main id="m"></main></div></div><div id="toast" class="hide" role="status"></div>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
const API_URL='GANTI_DENGAN_URL_WEB_APP';
const $=s=>document.querySelector(s),rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID'),ic=(n,t)=>`<i data-lucide="${n}"${t?` title="${t}"`:''}></i>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hp=s=>String(s||'').replace(/^'/,''),today=()=>new Date().toLocaleDateString('sv-SE');
let S=null,view='dash',CFG={nama:'LOSMENKU'},RES=[];
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
S=LS('sess',null);let Q=LS('queue',[]),C=LS('cache',{});const saveQ=()=>SV('queue',Q),saveC=()=>SV('cache',C);
let raf;new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>window.lucide&&lucide.createIcons())}).observe(document.body,{childList:true,subtree:true});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),3500)}
const E=(m,net)=>{const e=new Error(m);e.net=net;return e};
async function net(action,data){
  if(!API_URL.startsWith('https://'))throw E('API_URL belum diatur di index.html',false);
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data,token:S&&S.token}),signal:ctl.signal});
    const j=await r.json();
    if(!j.ok){if(j.error==='SESSION'){logout(true);const e=E('Sesi berakhir, silakan login kembali',false);e.session=true;throw e}throw E(j.error,false)}
    return j.data;
  }catch(e){if(e.net===false)throw e;throw E(e.name==='AbortError'?'Koneksi timeout, coba lagi':'Tidak dapat terhubung ke server',true)}finally{clearTimeout(t)}
}
/* ---- offline: cache baca, antrean tulis, sinkron otomatis ---- */
const WQ=new Set(['roomStatus','roomSave','roomDelete','resSave','pay','resAction']),RC=['roomList','resList','settingsGet'];
const online=()=>navigator.onLine;
function netUI(){const b=$('#sy');if(!b)return;const off=!online(),n=Q.length;b.classList.toggle('hide',!off&&!n);
  b.innerHTML=(off?ic('wifi-off')+'Offline':ic('refresh-cw')+'Sinkron')+(n?' · '+n:'');b.title=n?n+' data menunggu sinkronisasi':'Mode offline'}
function dashLocal(){const k=C.roomList||[],r=C.resList||[],t=today(),cnt=s=>k.filter(x=>x.status===s).length,sum=(l,f)=>l.reduce((a,x)=>a+f(x),0);
  return{total:k.length,tersedia:cnt('Tersedia'),terisi:cnt('Terisi'),dibersihkan:cnt('Dibersihkan'),perbaikan:cnt('Perbaikan'),checkinHariIni:r.filter(x=>x.checkin===t&&x.status==='Booking').length,checkoutHariIni:r.filter(x=>x.checkout===t&&x.status==='Check-in').length,
  okupansi:k.length?Math.round(cnt('Terisi')/k.length*100):0,pendapatan:sum(r.filter(x=>x.status!=='Batal'),x=>+x.dibayar||0),piutang:sum(r.filter(x=>['Booking','Check-in','Selesai'].includes(x.status)),x=>Math.max(0,x.total-(+x.dibayar||0)))}}
function local(a,d){ // terapkan perubahan ke cache lokal + validasi dasar
  const rooms=C.roomList=C.roomList||[],res=C.resList=C.resList||[],room=id=>rooms.find(x=>x.id===id),R=id=>res.find(x=>x.id===id),bad=m=>{throw E(m,false)};
  if(a==='roomStatus')(room(d.id)||bad('Kamar tidak ditemukan')).status=d.status;
  if(a==='roomSave'){const id=String(d.id).trim().toUpperCase(),k=room(id),o={id,nama:d.nama,tipe:d.tipe,harga:+d.harga,status:k?k.status:'Tersedia'};k?Object.assign(k,o):rooms.push(o)}
  if(a==='roomDelete'){if(res.some(x=>x.kamar===d.id&&['Booking','Check-in'].includes(x.status)))bad('Kamar masih memiliki reservasi aktif');C.roomList=rooms.filter(x=>x.id!==d.id)}
  if(a==='resSave'){const k=room(d.kamar)||bad('Kamar tidak ditemukan');if(String(d.tamu).trim().length<2)bad('Data tamu tidak valid');if(!d.checkin||!d.checkout||d.checkout<=d.checkin)bad('Tanggal check-out harus setelah check-in');
    if(res.some(x=>x.kamar===k.id&&['Booking','Check-in'].includes(x.status)&&x.checkin<d.checkout&&x.checkout>d.checkin))bad('Reservasi bentrok: kamar sudah dipesan pada tanggal tersebut');
    res.unshift({id:d.id,tamu:d.tamu,hp:d.hp,kamar:k.id,checkin:d.checkin,checkout:d.checkout,total:Math.round((new Date(d.checkout)-new Date(d.checkin))/864e5)*k.harga,status:'Booking',oleh:S.user.username,dibayar:0,metode:''})}
  if(a==='pay'){const r=R(d.id)||bad('Reservasi tidak ditemukan'),j=+d.jumlah;if(r.status==='Batal'||!(j>0)||j>r.total-r.dibayar)bad('Jumlah pembayaran tidak valid');r.dibayar=+r.dibayar+j;r.metode=d.metode}
  if(a==='resAction'){const r=R(d.id)||bad('Reservasi tidak ditemukan'),m={checkin:['Booking','Check-in','Terisi'],checkout:['Check-in','Selesai','Dibersihkan'],batal:['Booking','Batal',null]}[d.type];
    if(!m||r.status!==m[0])bad('Status reservasi tidak sesuai untuk aksi ini');if(d.type==='checkout'&&+r.dibayar<+r.total)bad('Pelunasan belum selesai. Catat pembayaran sebelum check-out');r.status=m[1];if(m[2]&&room(r.kamar))room(r.kamar).status=m[2]}
  saveC()}
async function prefetch(){if(!online()||Q.length||!S)return;try{for(const a of RC)C[a]=await net(a);saveC();CFG=C.settingsGet||CFG;$('#pn').textContent=CFG.nama}catch(e){}}
let syncing=false;
async function sync(){
  if(syncing||!Q.length||!online()||!S)return;syncing=true;netUI();let n=0,stop=false;
  try{while(Q.length&&!stop){const o=Q[0];
    try{await net(o.a,{...o.d,opId:o.id})}catch(e){if(e.net||e.session){stop=true;break}toast('Sinkron ditolak ('+o.a+'): '+e.message)}
    Q.shift();saveQ();n++;netUI()}}
  finally{syncing=false;netUI()}
  if(n&&!Q.length){await prefetch();toast(n+' data offline berhasil disinkronkan');if(S&&!document.querySelector('.mask'))go(view)}}
async function api(a,d={}){
  if(WQ.has(a)){
    d={...d,opId:crypto.randomUUID()};if(a==='resSave'&&!d.id)d.id='R'+new Date().toLocaleString('sv-SE').replace(/\D/g,'').slice(2)+Math.random().toString(36).slice(2,5).toUpperCase();
    if(!Q.length&&online()){try{return await net(a,d)}catch(e){if(!e.net)throw e}}
    local(a,d);const{opId,...rest}=d;Q.push({id:opId,a,d:rest});saveQ();netUI();toast('Disimpan offline, otomatis dikirim saat online');sync();return 'queued'}
  if(RC.includes(a)||a==='dashboard'){
    if(Q.length)await sync();
    if(!Q.length&&online()){try{const r=await net(a,d);if(RC.includes(a)){C[a]=r;saveC()}return r}catch(e){if(!e.net)throw e}}
    if(a==='dashboard'&&C.roomList)return dashLocal();
    if(C[a])return JSON.parse(JSON.stringify(C[a]));
    throw E('Data belum tersedia offline. Hubungkan ke internet terlebih dahulu',true)}
  if(!online()&&a!=='logout')throw E('Fitur ini membutuhkan koneksi internet',true);
  return net(a,d)}
addEventListener('online',()=>{netUI();sync()});addEventListener('offline',netUI);setInterval(sync,30000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const run=async(f,ok)=>{try{await f();if(ok)toast(ok)}catch(e){toast(e.message)}};
async function show(){const on=!!S;$('#login').classList.toggle('hide',on);$('#shell').classList.toggle('hide',!on);
  if(!on)return;$('#who').textContent=S.user.nama+' · '+S.user.role;
  document.querySelectorAll('.adm').forEach(e=>e.classList.toggle('hide',S.user.role!=='admin'));
  netUI();CFG=C.settingsGet||CFG;$('#pn').textContent=CFG.nama;go(view);await sync();await prefetch()}
function logout(silent){if(S&&!silent){if(Q.length&&!confirm(Q.length+' data offline belum tersinkron. Data tetap tersimpan dan dikirim saat login berikutnya. Keluar?'))return;net('logout').catch(()=>{})}S=null;C={};localStorage.removeItem('sess');localStorage.removeItem('cache');show()}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';$('#lb').disabled=true;
  try{S=await api('login',{username:$('#u').value,password:$('#p').value});SV('sess',S);$('#p').value='';show()}
  catch(x){$('#le').textContent=x.message}$('#lb').disabled=false};
$('#out').onclick=()=>logout();
document.querySelectorAll('nav [data-v]').forEach(a=>a.onclick=()=>go(a.dataset.v));
function go(v){view=v;document.querySelectorAll('nav [data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===v));$('#m').innerHTML='<p>Memuat…</p>';run(()=>V[v]())}
function modal(title,body,onOk,okLabel='Simpan'){const d=document.createElement('div');d.className='mask';
  d.innerHTML=`<form class="box"><h2 style="margin-bottom:8px">${esc(title)}</h2>${body}<div class="err"></div><div style="display:flex;gap:8px;margin-top:12px">${onOk?`<button class="btn" style="flex:1">${okLabel}</button>`:''}<button type="button" class="btn g" style="flex:1">${onOk?'Batal':'Tutup'}</button></div></form>`;
  document.body.append(d);const f=d.firstChild,x=()=>d.remove();f.querySelector('.g').onclick=x;
  f.onsubmit=async e=>{e.preventDefault();if(!onOk)return;const o=Object.fromEntries(new FormData(f)),b=f.querySelector('.btn');b.disabled=true;try{await onOk(o);x()}catch(er){f.querySelector('.err').textContent=er.message;b.disabled=false}};return f}
const inp=(n,l,t='text',v='',x='')=>`<label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" required ${x}>`;
const sel=(n,l,o,v)=>`<label>${l}</label><select name="${n}">${o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows||`<tr><td colspan="${h.length}">Belum ada data</td></tr>`}</table></div>`;
const tag=(s,l)=>`<span class="tag ${esc(s)}">${esc(l||s)}</span>`,btn=(i,t,at,c='')=>`<button class="btn s ${c}" title="${t}" ${at}>${ic(i)}</button>`;
const card=(i,l,v,x='')=>`<div class="card"><small>${ic(i)}${l}</small><b>${v}</b>${x}</div>`;
/* ---- struk ---- */
function struk(r){const L=(a,b)=>a.padEnd(14)+String(b),w=32,c=s=>' '.repeat(Math.max(0,(w-s.length)>>1))+s,m=Math.round((new Date(r.checkout)-new Date(r.checkin))/864e5);
  return [c(CFG.nama),c(CFG.alamat),c('Telp '+CFG.telp),'-'.repeat(w),'KWITANSI '+r.id,'-'.repeat(w),L('Tamu',r.tamu),L('Kamar',r.kamar),L('Check-in',r.checkin),L('Check-out',r.checkout),L('Malam',m),'-'.repeat(w),L('Total',rp(r.total)),L('Dibayar',rp(r.dibayar)),L('Sisa',rp(r.total-r.dibayar)),L('Metode',r.metode||'-'),L('Status',r.total-r.dibayar<=0?'LUNAS':'BELUM LUNAS'),'-'.repeat(w),c(CFG.footer)].join('\n')}
function kwitansi(r){const t=struk(r),f=modal('Kwitansi',`<div class="rc">${esc(t)}</div>`);
  f.querySelector('.err').insertAdjacentHTML('afterend',`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button type="button" class="btn k" id="wa" style="flex:1">${ic('message-circle')}WhatsApp</button><button type="button" class="btn" id="pr" style="flex:1">${ic('printer')}Cetak 58mm</button></div>`);
  f.querySelector('#wa').onclick=()=>{let n=hp(r.hp).replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);window.open('https://wa.me/'+n+'?text='+encodeURIComponent(t),'_blank','noopener')};
  f.querySelector('#pr').onclick=()=>{const d=document.createElement('div');d.id='rcp';d.textContent=t;document.body.append(d);window.print();d.remove()}}
/* ---- views ---- */
const V={
async dash(){const[d,r]=await Promise.all([api('dashboard'),api('resList')]),t=today();
  const row=(x,a)=>`<tr><td><b>${esc(x.tamu)}</b></td><td>${esc(x.kamar)}</td><td>${esc(x.checkin)} → ${esc(x.checkout)}</td><td>${tag(x.status)}</td></tr>`;
  $('#m').innerHTML=`<div class="top"><h2>Halo, ${esc(S.user.nama)}</h2></div><div class="grid">${card('building','Total Kamar',d.total)+card('door-open','Tersedia',d.tersedia)+card('bed-double','Terisi',d.terisi,`<div class="bar"><i style="width:${d.okupansi}%"></i></div>`)+card('sparkles','Dibersihkan',d.dibersihkan)+card('wrench','Perbaikan',d.perbaikan)+card('log-in','Check-in Hari Ini',d.checkinHariIni)+card('log-out','Check-out Hari Ini',d.checkoutHariIni)+card('wallet','Pendapatan',rp(d.pendapatan))+card('clock','Piutang',rp(d.piutang))}</div>
